<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1530"><title>عِشْ حياتك — محاكي الحياة</title>
<style>
:root{--bg:#1b1530;--card:#2a2147;--card2:#352a5c;--ac:#ffc857;--tx:#f4efff;--mu:#a99fcb;--g:#4cd68a;--r:#ff5d6c;--b:#4ea8ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif}
body{display:flex;flex-direction:column;max-width:720px;margin:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#top{padding:10px 14px;background:linear-gradient(135deg,#3a2a70,#231a42);display:flex;gap:10px;align-items:center}
#av{font-size:38px;width:56px;height:56px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center}
#nm{font-weight:700;font-size:18px}#sub{font-size:13px;color:var(--mu)}
#money{margin-inline-start:auto;text-align:left;font-weight:700;color:var(--ac)}
#stats{padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;background:var(--card)}
.st{font-size:12px}.st .bar{height:8px;background:#0003;border-radius:5px;overflow:hidden;margin-top:2px}.st .bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
#main{flex:1;overflow:auto;padding:10px 12px}
#log .y{margin:12px 0 4px;color:var(--ac);font-weight:700;font-size:14px}
#log p{margin:3px 0;padding:8px 10px;background:var(--card);border-radius:10px;font-size:15px;line-height:1.6}
#log p.good{border-inline-start:4px solid var(--g)}#log p.bad{border-inline-start:4px solid var(--r)}#log p.big{border-inline-start:4px solid var(--ac);background:var(--card2)}
#bar{display:flex;background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
#bar button{flex:1;background:none;padding:10px 2px;font-size:12px;color:var(--mu)}#bar button.on{color:var(--ac);font-weight:700}#bar button span{display:block;font-size:20px}
#focus{display:flex;gap:6px;padding:6px 12px 0;overflow-x:auto}#focus button{flex:none;background:var(--card);padding:7px 11px;border-radius:20px;font-size:13px;color:var(--mu)}#focus button.on{background:var(--ac);color:#2a1a00;font-weight:700}
#age{margin:8px 12px;padding:15px;border-radius:16px;background:linear-gradient(135deg,var(--ac),#ff9d3d);color:#2a1a00;font-size:20px;font-weight:800;box-shadow:0 4px 0 #b3721a}
#age:active{transform:translateY(3px);box-shadow:none}
.card{background:var(--card);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #fff1}.row:last-child{border:0}
.row .ic{font-size:26px}.row .t{flex:1}.row small{display:block;color:var(--mu)}
.btn{background:var(--card2);padding:9px 13px;border-radius:10px;margin:3px}.btn:active{background:#4a3c80}.btn.p{background:var(--ac);color:#2a1a00;font-weight:700}.btn[disabled]{opacity:.4}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .btn{margin:0;text-align:center}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.on{display:flex}#mb{width:100%;max-width:720px;max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#mb h2{margin:0 0 6px}#mb .tx{font-size:16px;line-height:1.7;margin-bottom:10px}
#mb .ch{display:block;width:100%;text-align:right;background:var(--card2);padding:13px;border-radius:12px;margin:7px 0;font-size:16px}
#mb .ch:active{background:#4a3c80}#mb .ch small{display:block;color:var(--mu)}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:0;background:var(--card2);color:var(--tx);font:inherit;font-size:17px;margin:6px 0}
.tag{display:inline-block;background:var(--card2);border-radius:20px;padding:3px 10px;margin:2px;font-size:13px}
.ach{opacity:.35}.ach.got{opacity:1}
.pill{font-size:12px;color:var(--mu)}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ac);color:#2a1a00;padding:8px 16px;border-radius:20px;font-weight:700;z-index:20;display:none}
</style></head><body>
<div id="top"><div id="av">🧒</div><div><div id="nm">—</div><div id="sub"></div></div><div id="money"></div></div>
<canvas id="scene" width="720" height="200" style="width:100%;height:100px;display:block"></canvas>
<div id="stats"></div>
<div id="main"><div id="log"></div></div>
<div id="focus"></div>
<button id="age">كبّر سنة ⏭️</button>
<div id="bar"></div>
<div id="modal"><div id="mb"></div></div><div id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
let rng=Math.random;const R=()=>rng(), ri=(a,b)=>Math.floor(R()*(b-a+1))+a, pick=a=>a[Math.floor(R()*a.length)];
const cl=(v,a=0,b=100)=>Math.max(a,Math.min(b,Math.round(v)));
const fmt=n=>(n<0?"-":"")+Math.abs(Math.round(n)).toLocaleString("ar-EG")+" ج";
const N=n=>Number(n).toLocaleString("ar-EG");
const MN=["أحمد","محمد","محمود","مصطفى","عمر","يوسف","علي","كريم","حسن","إبراهيم","طارق","خالد","ياسين","هاني","سامح","أيمن","شريف","وليد"];
const FN=["فاطمة","مريم","نور","سلمى","هدى","منى","ياسمين","دينا","آية","رنا","إيمان","سارة","هبة","نهى","ريم","جميلة","مي","أسماء"];
const SUR=["السيد","عبد الله","الشريف","حجازي","منصور","فوزي","النجار","عيسى","الجمل","شاهين","بدوي","رمضان"];
const CITIES=["القاهرة","الإسكندرية","طنطا","المنصورة","أسيوط","الأقصر","أسوان","بورسعيد","الزقازيق","دمياط"];
const TRAITS={amb:['🔥','طموح'],lazy:['🛋️','كسول'],soc:['🗣️','اجتماعي'],shy:['🤫','خجول'],pious:['🕌','متدين'],brave:['🦁','شجاع'],lucky:['🍀','محظوظ'],greedy:['🪙','حريص على الفلوس']};
const mname=()=>pick(MN),fname=()=>pick(FN);
let G=null;let DIFF=localStorage.getItem('life-diff')||'mid';const DF={easy:{n:'😌 سهل',liv:.7,die:.7},mid:{n:'⚖️ عادي',liv:1,die:1},hard:{n:'🔥 صعب',liv:1.35,die:1.4}};
const SAVE="life-sim-ar-v1", META="life-sim-ar-meta";
let META_=JSON.parse(localStorage.getItem(META)||'{"lives":0,"best":0,"ach":{},"legacy":0}');
const saveMeta=()=>localStorage.setItem(META,JSON.stringify(META_));

/* ---------- الإنجازات ---------- */
const ACH={
 grad:["🎓","خريج","خلّص الجامعة"],rich:["💰","مليونير","وصّل فلوسك لمليون"],old:["👴","عمر طويل","عِش لحد ٩٠"],cent:["💯","المعمّر","عِش لحد ١٠٠"],
 hajj:["🕋","حجّ بيت الله","أدّي الحج"],wed:["💍","اتجوزت","اتجوز"],kids:["👶","بيت عامر","خلّف ٣ أولاد أو أكتر"],doc:["🩺","دكتور","اشتغل دكتور"],
 boss:["🏢","صاحب شركة","افتح شركتك"],fame:["⭐","مشهور","وصّل الشهرة ٨٠"],prison:["⛓️","ورا الشمس","اتسجن"],mil:["🪖","خدمت الوطن","خلّص الجيش"],
 trav:["✈️","رحّالة","سافر ٥ مرات"],pass:["🕊️","حياة بسيطة","مت وإنت راضي (سعادة ٧٠+)"],book:["📚","كاتب","اطبع كتاب"],lotto:["🎰","حظّ","اكسب جائزة كبيرة"],
 fam:["👨‍👩‍👧‍👦","جد وجدة","بقى عندك أحفاد"],poor:["🌱","من الصفر","ابدأ في أسرة فقيرة وعدّي ٥٠٠ ألف"],villa:["🏡","فيلا الساحل","اشتري فيلا"],all:["🧩","متكامل","صحة وذكاء وجمال وعلاقات ٧٠+ بعد الأربعين"],faith:["🌙","القلب المطمئن","إيمان ٩٠٪ بعد الأربعين"],abroad:["🛫","مغترب","اشتغل بره مصر"],gm:["🏆","المتفوق","جيب مجموع ٩٥٪+ في الثانوية"]
};
function ach(k){if(META_.ach[k])return;META_.ach[k]=1;saveMeta();toast("🏅 إنجاز: "+ACH[k][1]);}
let SND=localStorage.getItem('life-snd')!=='0';let AC=null;
function beep(f=520,d=.08){if(!SND)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function toast(t){beep(880,.12);const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2200);}

/* ---------- الحياة ---------- */
const STAGES=[[0,"رضيع","👶"],[3,"طفل","🧒"],[6,"تلميذ","🎒"],[13,"مراهق","🧑"],[18,"شاب","🧑‍🎓"],[30,"بالغ","🧔"],[50,"كبير","👨‍🦳"],[65,"مسن","👴"]];
const stage=a=>{let s=STAGES[0];for(const x of STAGES)if(a>=x[0])s=x;return s;};
function newLife(name,male){
 const bonus=META_.legacy;
 const fam=pick([{n:"أسرة بسيطة",m:3000,w:0},{n:"أسرة متوسطة",m:15000,w:1},{n:"أسرة ميسورة",m:60000,w:2},{n:"أسرة فقيرة",m:0,w:-1}]);
 G={name,male,age:0,city:pick(CITIES),smarts:ri(25,75),looks:ri(25,75),health:ri(65,95),happy:ri(55,80),social:ri(30,60),stress:10,
  money:0,famMoney:fam.m,famName:fam.n,wealthLvl:fam.w,fame:0,faith:ri(30,70),
  edu:"none",school:null,grade:0,job:null,jobYears:0,salary:0,perf:50,
  rels:[],assets:[],tags:[],log:[],yearLog:[],flags:{},travel:0,kids:0,dead:false,causeOfDeath:"",
  gpa:0,tracks:[],skills:{},crimeRec:0,mil:male?"pending":"none",startBonus:bonus,debt:0,deaths:[],diff:DIFF};
 const f=mname()+" "+pick(SUR);
 G.surname=pick(SUR);
 G.traits=[];while(G.traits.length<2){const t=pick(Object.keys(TRAITS));if(!G.traits.includes(t)&&!(t==='soc'&&G.traits.includes('shy'))&&!(t==='shy'&&G.traits.includes('soc')))G.traits.push(t);}
 if(G.traits.includes('soc'))G.social=cl(G.social+15);if(G.traits.includes('pious'))G.faith=cl(G.faith+25);if(G.traits.includes('shy'))G.social=cl(G.social-12);if(G.traits.includes('lucky'))G.happy=cl(G.happy+8);
 G.rels.push({id:"dad",t:"أب",n:mname()+" "+G.surname,ic:"👨",bond:ri(50,90),age:ri(24,40),alive:true});
 G.rels.push({id:"mom",t:"أم",n:fname()+" "+G.surname,ic:"👩",bond:ri(60,95),age:ri(22,38),alive:true});
 const sib=ri(0,3);for(let i=0;i<sib;i++){const m=R()<.5;G.rels.push({id:"sib"+i,t:m?"أخ":"أخت",n:(m?mname():fname())+" "+G.surname,ic:m?"👦":"👧",bond:ri(30,85),age:ri(0,10),alive:true,sib:true});}
 if(bonus>0){G.money+=bonus;addLog("🕊️ ورثت من حياتك السابقة "+fmt(bonus)+" أمانة.","good");META_.legacy=0;saveMeta();}
 addLog('سماتك: '+G.traits.map(t=>TRAITS[t][0]+' '+TRAITS[t][1]).join('، '),'big');
 addLog(`وُلدت في ${G.city}، في ${G.famName}. ${G.male?"ولد":"بنت"} جديد اسمه ${name} 🍼`,"big");
 addLog(`والدك ${G.rels[0].n} ووالدتك ${G.rels[1].n}${sib?` ولك ${sib} إخوات`:" وانت الوحيد"}.`);
 flush();render();save();
}
function addLog(t,c=""){G.yearLog.push({t,c});}
function flush(){if(!G||!G.yearLog.length)return;G.log.push({age:G.age,items:G.yearLog});G.yearLog=[];if(G.log.length>120)G.log.shift();}
function stat(k,d){const o=G[k];G[k]=cl(G[k]+d);return G[k]-o;}
function income(){return G.job?G.salary:0;}
function money(d,why){d=Math.round(d);G.money+=d;if(why)addLog((d>=0?"💵 ":"💸 ")+why+" ("+fmt(d)+")",d>=0?"good":"bad");}
function rel(id){return G.rels.find(r=>r.id===id);}
function alive(){return G.rels.filter(r=>r.alive);}
function has(t){return G.tags.includes(t);}
function tag(t){if(!has(t))G.tags.push(t);}
function jobName(){if(!G.job)return "عاطل";const lv=Math.min(3,Math.floor(G.jobYears/5));return (['','أول ','كبير ','مدير '][lv]||'')+G.job.n;}

/* ---------- الوظائف ---------- */
const JOBS=[
 {id:"cashier",n:"كاشير",min:16,edu:0,sal:36000,ic:"🧾"},{id:"waiter",n:"جرسون",min:16,edu:0,sal:34000,ic:"🍽️"},{id:"driver",n:"سائق",min:18,edu:0,sal:48000,ic:"🚕"},
 {id:"worker",n:"عامل مصنع",min:18,edu:0,sal:42000,ic:"🏭"},{id:"cc",n:"كول سنتر",min:18,edu:1,sal:60000,ic:"🎧"},{id:"sales",n:"مندوب مبيعات",min:19,edu:1,sal:72000,ic:"📦"},
 {id:"teacher",n:"مدرّس",min:22,edu:2,sal:80000,ic:"📖",need:"edu"},{id:"acct",n:"محاسب",min:22,edu:2,sal:96000,ic:"🧮",need:"com"},
 {id:"dev",n:"مبرمج",min:21,edu:2,sal:180000,ic:"💻",need:"sci",smart:55},{id:"eng",n:"مهندس",min:22,edu:2,sal:150000,ic:"📐",need:"eng"},
 {id:"doc",n:"دكتور",min:25,edu:3,sal:260000,ic:"🩺",need:"med",smart:65},{id:"lawyer",n:"محامي",min:23,edu:2,sal:130000,ic:"⚖️",need:"law"},
 {id:"police",n:"ظابط شرطة",min:22,edu:2,sal:120000,ic:"👮"},{id:"nurse",n:"تمريض",min:20,edu:1,sal:84000,ic:"💉"},
 {id:"artist",n:"فنان / مطرب",min:18,edu:0,sal:50000,ic:"🎤",looks:55},{id:"chef",n:"شيف",min:19,edu:0,sal:70000,ic:"👨‍🍳"},
 {id:"farmer",n:"فلاح (أرض عيلتك)",min:16,edu:0,sal:40000,ic:"🌾"},{id:"it",n:"فني دعم تقني",min:20,edu:1,sal:78000,ic:"🖥️"}
];
const EDUN=["بدون مؤهل","ثانوية","جامعي","دراسات عليا"];
const FACS=[["med","طب 🩺",75],["eng","هندسة 📐",65],["sci","حاسبات وعلوم 💻",60],["com","تجارة 🧮",40],["law","حقوق ⚖️",45],["edu","تربية 📖",35],["art","فنون وآداب 🎨",30]];

/* ---------- الأحداث ---------- */
// كل حدث: a=أقل سن، b=أكبر سن، w=وزن، ok=شرط، t=نص، c=اختيارات [{t,s(sub),f()}]
const EV=[];
const E=(o)=>EV.push(o);
E({id:"firststep",a:1,b:1,w:99,t:"أول خطوة! مشيت من غير ما تقع 🚶",c:[{t:"ابتسم 😄",f(){stat("happy",5);rel("mom").bond=cl(rel("mom").bond+5);}}]});
E({id:"firstword",a:2,b:2,w:99,t:"قلت أول كلمة. كانت…",c:[{t:"«ماما» 👩",f(){rel("mom").bond=cl(rel("mom").bond+10);}},{t:"«بابا» 👨",f(){rel("dad").bond=cl(rel("dad").bond+10);}},{t:"«لأ!» 🙅",f(){stat("smarts",3);addLog("العناد بدأ بدري.");}}]});
E({id:"kg",a:4,b:4,w:99,t:"أول يوم حضانة. عيطت وعملت دوشة!",c:[{t:"اتأقلمت وعملت صحاب",f(){stat("social",8);}},{t:"فضلت أعيط",f(){stat("happy",-4);}}]});
E({id:"kidfight",a:6,b:12,w:5,t:"زميلك في الفصل خد منك الساندوتش وضحك عليك.",c:[{t:"ضربته 👊",f(){stat("social",-3);if(R()<.4){addLog("المدرس اتصل بباباك.","bad");rel("dad").bond=cl(rel("dad").bond-8);}else{addLog("خلاص بقى يخاف منك.","good");stat("happy",3);}}},{t:"قلت للمدرس",f(){stat("happy",-2);addLog("اتعاقب هو.");}},{t:"سيبتها",f(){stat("stress",4);}}]});
E({id:"cheat",a:8,b:17,w:5,ok:()=>G.school,t:"في الامتحان، زميلك بيشاور على ورقتك.",c:[{t:"سيبته ينقل",f(){stat("social",5);if(R()<.3){stat("smarts",-3);addLog("المراقب شافكم! صفر.","bad");}}},{t:"غطيت الورقة",f(){stat("social",-2);}},{t:"أنا كمان بنقل منه",f(){if(R()<.5){addLog("اتمسكت وخدت إنذار.","bad");stat("smarts",-3);}else{stat("smarts",1);}}}]});
E({id:"pet",a:5,b:14,w:4,ok:()=>!has("pet"),t:"لقيت قطة صغيرة قدام البيت.",c:[{t:"ربيتها 🐱",f(){tag("pet");stat("happy",8);G.assets.push({n:"قطة",ic:"🐱",v:0});addLog("القطة بقت صاحبتك.","good");}},{t:"سبتها",f(){stat("happy",-2);}},{t:"سلمتها لجارتك",f(){stat("social",2);}}]});
E({id:"quran",a:7,b:13,w:5,t:"باباك عايزك تحفظ جزء من القرآن.",c:[{t:"حفظت بجد 📖",f(){G.faith=cl(G.faith+10);stat("smarts",3);rel("dad").bond=cl(rel("dad").bond+6);}},{t:"اتكاسلت",f(){stat("happy",2);}}]});
E({id:"football",a:8,b:16,w:5,t:"الأولاد بيلعبوا كورة في الشارع.",c:[{t:"لعبت معاهم ⚽",f(){stat("health",3);stat("social",4);if(R()<.15){addLog("اتعورت في رجلك.","bad");stat("health",-8);}}},{t:"فضلت أذاكر",f(){stat("smarts",3);}},{t:"قعدت على الموبايل",f(){stat("happy",3);stat("health",-2);}}]});
E({id:"bully",a:9,b:16,w:5,t:"في واحد في المدرسة بيضايقك كل يوم.",c:[{t:"واجهته",f(){if(R()<.5){addLog("وقف عند حده وبقيتوا أصحاب!","good");stat("social",5);}else{addLog("اتضربت.","bad");stat("health",-6);}}},{t:"قلت لباباك",f(){rel("dad").bond=cl(rel("dad").bond+4);stat("stress",-4);}},{t:"استحملت",f(){stat("stress",10);stat("happy",-6);}}]});
E({id:"tablet",a:9,b:15,w:4,t:"أهلك سألوك: عايز إيه هدية النجاح؟",c:[{t:"موبايل جديد 📱",f(){stat("happy",6);G.assets.push({n:"موبايل",ic:"📱",v:3000});}},{t:"كتب ورحلة",f(){stat("smarts",4);}},{t:"بلاي ستيشن 🎮",f(){stat("happy",8);stat("health",-2);G.assets.push({n:"بلاي ستيشن",ic:"🎮",v:8000});}}]});
E({id:"crush",a:12,b:17,w:7,ok:()=>!G.flags.crushed,t:"حسّيت إنك معجب بحد في الدروس.",c:[{t:"صارحته/ـها",f(){G.flags.crushed=1;if(R()<.35+G.looks/250){addLog("بادلك نفس الشعور 💖","good");stat("happy",10);G.rels.push({id:"crush",t:"صديق/ة مقرّب",n:(G.male?fname():mname())+" "+pick(SUR),ic:"💗",bond:60,age:G.age,alive:true});}else{addLog("اتحرجت جامد 😳","bad");stat("happy",-9);}}},{t:"كتمتها",f(){G.flags.crushed=1;stat("stress",5);}}]});

function pickEvents(){
 const out=[];
 const forced=EV.filter(e=>e.w>=99&&G.age>=e.a&&G.age<=e.b&&!G.flags["ev_"+e.id]&&(!e.ok||e.ok()));
 forced.forEach(e=>{G.flags["ev_"+e.id]=1;out.push(e);});
 const pool=EV.filter(e=>e.w<99&&G.age>=e.a&&G.age<=e.b&&(!e.ok||e.ok()));
 const n=G.age<6?0:R()<.6?1:R()<.3?2:0;
 for(let i=0;i<n;i++){const tot=pool.reduce((s,e)=>s+e.w,0);let x=R()*tot;for(const e of pool){x-=e.w;if(x<=0){if(!out.includes(e))out.push(e);break;}}}
 if(G.age>=18&&!G.flags.ev_univ&&G.age===18){}
 return out;
}

 e.c.forEach((c,i)=>{h+=`<button class="ch" data-a="${i}" ${c.ok&&!c.ok()?"disabled style='opacity:.4'":""}>${c.t}${c.s?`<small>${c.s}</small>`:""}</button>`;});

}

  G.causeOfDeath=c;endLife();
 }
}

  h+=`</div><div class="card"><b>💹 استثمارات (${fmt(invTotal())})</b>`;Object.entries(INV).forEach(([k,v])=>{const a=(G.inv||{})[k]||0;h+=`<div class="row"><div class="ic">${v[0]}</div><div class="t">${v[1]}<small>${fmt(a)} · متوقع ${N(v[2])}٪ سنويًا، مخاطرة ${v[3]>20?"عالية":v[3]>8?"متوسطة":"قليلة"}</small></div><button class="btn" data-inv="${k}" data-do="in">+٥٠ ألف</button><button class="btn" data-inv="${k}" data-do="out">سحب</button></div>`;});h+=`</div><div class="card"><b>متجر</b>`;
  [["car","🚗","عربية",250000],["house","🏠","شقة",900000],["villa","🏡","فيلا الساحل",4000000],["watch","⌚","ساعة فاخرة",90000]].forEach(a=>{h+=`<div class="row"><div class="ic">${a[1]}</div><div class="t">${a[2]}<small>${fmt(a[3])}</small></div><button class="btn p" data-buy="${a[0]}" ${G.money<a[3]||G.age<18?"disabled":""}>اشتري</button></div>`;});
  h+="</div>";
 }
 if(tab==="me"){
  h+=`<div class="card"><b>🧬 حياتك دي</b><div>${(G.traits||[]).map(t=>`<span class="tag">${TRAITS[t][0]} ${TRAITS[t][1]}</span>`).join('')}</div><div class="pill">الإيمان ${G.faith}٪ · الشهرة ${G.fame}٪ · سفر ${G.travel} مرات · سجل جنائي ${G.crimeRec}</div><div class="pill">عدد الحيوات: ${N(META_.lives)} · أفضل نتيجة ${N(META_.best)}</div></div><div class="card"><b>🏅 الإنجازات (${Object.keys(META_.ach).length}/${Object.keys(ACH).length})</b>`;
  Object.entries(ACH).forEach(([k,a])=>h+=`<div class="row ach ${META_.ach[k]?"got":""}"><div class="ic">${a[0]}</div><div class="t">${a[1]}<small>${a[2]}</small></div></div>`);
  h+=`</div><button class="btn" id="snd">${SND?'🔊 الصوت شغال':'🔇 الصوت مقفول'}</button> <button class="btn" id="reset">🗑️ ابدأ حياة جديدة (هتفقد دي)</button>`;
 }
 m.innerHTML=h;
 $("#age").style.display=G.dead?"none":"block";
}
$("#main").addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t||!G||G.dead)return;
 if($("#modal").classList.contains("on"))return;
 if(t.dataset.job){applyJob(JOBS.find(j=>j.id===t.dataset.job));}
 if(t.id==="quit"){loseJob("استقلت");flush();render();save();}
 if(t.id==="phd"){G.school={t:"u",y:1,fac:"grad"};money(-90000);addLog("بدأت دراسات عليا.");G.flags.phd=1;flush();render();save();}
 if(t.id==="snd"){SND=!SND;localStorage.setItem('life-snd',SND?'1':'0');render();}
 if(t.id==="reset"){if(confirm("متأكد؟ هتفقد الحياة الحالية.")){localStorage.removeItem(SAVE);startScreen();}}
 if(t.dataset.rel){const r=rel(t.dataset.rel);if(G.flags.act===G.age){toast("استنى للسنة الجاية");return;}G.flags.act=G.age;r.bond=cl(r.bond+ri(6,14));stat("happy",4);stat("stress",-3);addLog(`قضيت وقت حلو مع ${r.n}.`,"good");r.mem=r.mem||[];if(R()<.5)r.mem.push(pick(["قعدتوا ساعات تتكلموا","خرجتوا مشوار حلو","ضحكتوا من قلبكم","أكلتوا مع بعض"])+" وانت عمرك "+N(G.age));if(r.mem.length>6)r.mem.shift();flush();render();save();}
 if(t.dataset.buy){const m={car:["🚗","عربية",250000],house:["🏠","شقة",900000],villa:["🏡","فيلا الساحل",4000000],watch:["⌚","ساعة فاخرة",90000]}[t.dataset.buy];if(G.money<m[2])return;G.money-=m[2];G.assets.push({id:t.dataset.buy,ic:m[0],n:m[1],v:m[2]});stat("happy",8);addLog(`🛍️ اشتريت ${m[1]}.`,"good");if(t.dataset.buy==="house")addLog("مبقاش عليك إيجار.");flush();render();save();}
 if(t.dataset.inv){G.inv=G.inv||{gold:0,stock:0,bond:0};const k=t.dataset.inv;if(t.dataset.do==="in"){if(G.money<50000){toast("مفيش ٥٠ ألف");return;}G.money-=50000;G.inv[k]+=50000;}else{G.money+=G.inv[k];G.inv[k]=0;}render();save();}
 if(t.dataset.act)doAct(t.dataset.act);
});

function workGame(){
 let q=0,ok=0;const total=3;
 const next=()=>{
  if(q>=total){closeM();const d=ok-1;G.perf=cl(G.perf+d*7);stat("stress",3);if(ok===total){const b=Math.round(G.salary*.05);money(b,"مكافأة إنجاز");addLog("🎯 أنجزت المهمة بامتياز!","good");}else if(ok===0){addLog("🎯 المهمة فشلت وزعل المدير.","bad");}else addLog("🎯 أنجزت المهمة بشكل مقبول.");clamp();flush();render();save();return;}
  q++;const a=ri(12,60),b=ri(3,30),op=pick(["+","-","×"]);
  const ans=op==="+"?a+b:op==="-"?a-b:Math.min(a,12)*Math.min(b,12);
  const x=op==="×"?Math.min(a,12):a,y=op==="×"?Math.min(b,12):b;
  const opts=[ans,ans+ri(1,9),ans-ri(1,9),ans+10].filter((v,i,A)=>A.indexOf(v)===i).sort(()=>R()-.5);
  modal(`<h2>🎯 مهمة شغل ${N(q)}/${N(total)}</h2><div class="tx">احسب بسرعة: <b>${N(x)} ${op} ${N(y)}</b></div>${opts.map(o=>`<button class="ch" data-a="${o}">${N(o)}</button>`).join("")}`,v=>{if(Number(v)===ans)ok++;next();});
 };
 next();
}
function doAct(a){
 if(G.flags.act===G.age){toast("نشاط واحد كل سنة");return;}
 if(G.flags.jailLeft&&a!=="meditate"){toast("وانت في السجن؟");return;}
 const costs={gym:6000,doc:1500,skin:5000,gamble:10000};
 if(costs[a]&&G.money<costs[a]){toast("فلوسك مش كفاية");return;}
 G.flags.act=G.age;
 if(costs[a])money(-costs[a]);
 switch(a){
  case"gym":stat("health",10);stat("looks",4);stat("stress",-6);addLog("💪 اشتركت في جيم وجسمك اتحسن.","good");break;
  case"study":stat("smarts",6);stat("stress",5);addLog("📚 ذاكرت وقريت كتير. ذكاءك زاد.","good");break;
  case"doc":stat("health",8);addLog("🩺 عملت فحص شامل.","good");if(R()<.15)addLog("اكتشف مشكلة بدري ولحقتها.");break;
  case"meditate":stat("stress",-18);stat("happy",6);G.faith=cl(G.faith+6);addLog("🧘 اتأملت واتقرب لربنا.","good");break;
  case"friends":stat("social",8);stat("happy",8);stat("health",-1);addLog("🍻 خرجت مع الأصحاب.","good");break;
  case"skin":stat("looks",8);stat("happy",3);addLog("💅 اهتميت بشكلك.","good");break;
  case"volunteer":stat("happy",8);stat("social",6);G.faith=cl(G.faith+4);addLog("🤲 عملت عمل خيري.","good");break;
  case"side":if(G.age<16){toast("صغير");G.flags.act=-1;return;}stat("stress",8);const g=ri(10,40)*1000;money(g,"شغل جانبي");stat("smarts",1);break;
  case"task":if(!G.job){toast("محتاج شغل الأول");G.flags.act=-1;return;}G.flags.act=G.age;clamp();flush();render();workGame();return;
  case"gamble":if(R()<.35){money(ri(15,50)*1000,"كسبت الرهان");stat("happy",6);}else{addLog("🎲 خسرت الرهان.","bad");stat("happy",-5);}break;
  case"date":if(G.age<16){toast("صغير");G.flags.act=-1;return;}if(rel("spouse")){addLog("انت متجوز!");break;}if(rel("fiance")){addLog("انت مخطوب!");break;}startDating(false);break;
 }
 clamp();flush();render();save();
}
function save(){if(G&&!G.dead){try{localStorage.setItem(SAVE,JSON.stringify(Object.assign({},G,{pending:null})));}catch(e){}}}
function seeded(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dailyKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
var GOALS=[["ثري","اجمع ٧٠٠ ألف جنيه (فلوس + استثمارات) قبل سن ٥٥",g=>g.money+invTotal()>=700000&&g.age>=55],["أب وأم","وصّل لـ ٣ أولاد وسعادة ٦٠+ في سن ٥٠",g=>g.kids>=3&&g.happy>=60&&g.age>=50],["المتعلم","خلّص الجامعة وعِش لسن ٧٠",g=>g.edu==="uni"&&g.age>=70]];
function startDaily(){
 const k=dailyKey();rng=seeded(k);window.__daily=k;
 const goal=GOALS[k%GOALS.length];
 closeM();newLife(pick(MN)+"",R()<.5);G.daily={k,goal:k%GOALS.length};
 addLog("🌍 تحدي اليوم: "+goal[1],"big");flush();render();save();
}
function startScreen(){
 rng=Math.random;
 G=null;$("#log").innerHTML="";
 $("#age").style.display="none";
 $("#nm").textContent="حياة جديدة";$("#sub").textContent="";$("#money").textContent="";$("#stats").innerHTML="";$("#av").textContent="🍼";$("#main").innerHTML="";
 let h=`<h2>🍼 عِش حياتك</h2><div class="tx">هتتولد وتعيش حياة كاملة: مدرسة، ثانوية عامة، جامعة، جيش، شغل، جواز، أولاد، وشيخوخة. كل قرار بيأثر. وكل حياة مختلفة.</div>
 <div class="pill">الحيوات السابقة: ${N(META_.lives)} · أفضل نتيجة: ${N(META_.best)}${META_.legacy?` · ميراث جاهز: ${fmt(META_.legacy)}`:""}</div>
 <div style="margin:8px 0">${Object.entries(DF).map(([k,v])=>`<button class="btn ${DIFF===k?"p":""}" data-d="${k}">${v.n}</button>`).join("")}</div>
 <input type="text" id="nameIn" placeholder="اسمك" maxlength="14" value="">
 <button class="ch" data-a="m">👦 ولد</button><button class="ch" data-a="f">👧 بنت</button><button class="ch" data-a="r">🎲 عشوائي بالكامل</button><button class="ch" data-a="daily">🌍 تحدي اليوم (نفس الحياة لكل الناس)<small>${GOALS?GOALS[dailyKey()%GOALS.length][1]:""}</small></button>`;
 modal(h,a=>{if(a.length===0)return;if(a==="daily"){startDaily();return;}let m=a==="m";if(a==="r")m=R()<.5;let n=($("#nameIn").value||"").trim()||(m?mname():fname());closeM();newLife(n,m);});
}
function init(){
 buildBar();
 try{const s=localStorage.getItem(SAVE);if(s){G=JSON.parse(s);G.pending=null;flush();render();
  modal(`<h2>أهلًا من تاني</h2><div class="tx">لقيت حياة محفوظة: <b>${G.name}</b> عمر ${N(G.age)}.</div><button class="ch" data-a="c">كمّل ▶️</button><button class="ch" data-a="n">حياة جديدة</button>`,a=>{closeM();if(a==="n"){startScreen();}});return;}}catch(e){}
 startScreen();
}
window.__dbg={endLife,startDaily,get G(){return G;},ageUp,newLife,share:shareCard};
init();
</script></body></html>
